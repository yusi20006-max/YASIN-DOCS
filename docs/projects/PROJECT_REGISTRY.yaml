rules:
  - "Do not infer a dependency solely from project naming."
  - "Do not mark a planned relationship as implemented."
  - "Use source-level evidence to promote provisional relationships to verified relationships."
  - "When two repositories overlap, document ownership boundaries before recommending consolidation or deletion."
