name: Ecosystem Quality Infrastructure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_consumers:
        description: "Force live consumer clone scan"
        required: false
        default: "true"

jobs:
  unit-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Contract boundary unit tests (#10)
        run: pytest tools/contract_boundary/tests/ -q

      - name: Architecture boundary unit tests (#12)
        run: pytest tools/architecture_boundary/tests/ -q

      - name: Integration harness unit tests (#11)
        run: pytest tools/integration_harness/tests/ -q

      - name: E2E certification harness (#15)
        run: |
          pytest tools/e2e_certification/tests/ -q
          python -m tools.e2e_certification

      - name: Security gate unit tests (#16)
        run: pytest tools/security_gate/tests/ -q

      - name: Secrets scan (docs tree) (#16)
        run: python -m tools.security_gate tools docs .github

      - name: Scanner fixture good (expect PASS)
        run: python -m tools.contract_boundary tools/contract_boundary/tests/fixtures/good

      - name: Scanner fixture bad (expect FAIL exit 1)
        run: |
          if python -m tools.contract_boundary tools/contract_boundary/tests/fixtures/bad; then
            echo "Expected non-zero exit for bad fixtures"
            exit 1
          fi
          echo "Bad fixtures correctly failed"

      - name: Architecture policy self-check
        run: python -m tools.architecture_boundary

  live-consumer-scan:
    runs-on: ubuntu-latest
    needs: unit-and-fixtures
    strategy:
      fail-fast: false
      matrix:
        repo:
          - yusi20006-max/YasinRelay
          - yusi20006-max/Yasinfeed
          - yusi20006-max/YasinPress-Rewrite-
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs-repo

      - name: Checkout consumer
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: consumer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan consumer for private Yasin-AI imports (#17)
        run: |
          cd docs-repo
          python -m tools.contract_boundary ../consumer

      - name: Report
        run: echo "Contract boundary scan PASS for ${{ matrix.repo }}"

  architecture-policy-job:
    runs-on: ubuntu-latest
    needs: unit-and-fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Architecture policy (#17)
        run: python -m tools.architecture_boundary
